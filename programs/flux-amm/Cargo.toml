[package]
name = "flux-amm"
version = "0.1.0"
description = "Nexus Protocol — Flux AMM: constant-product swap pool with LP shares and fees."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "flux_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
